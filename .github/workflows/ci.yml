name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nestjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/nestjs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e

  api-contract:
    name: API client and migrations up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the API client from the running backend
        run: npm run generate-and-update-api-client
      - name: Fail if the committed client is outdated
        run: |
          git add --intent-to-add packages/react-app/src/api/generated
          git diff --exit-code -- packages/react-app/src/api/generated
      - name: Fail if an entity changed without a migration
        run: docker compose exec -T nestjs npm run migration:generate -- src/migrations/Check --check
      - name: Stop containers
        if: always()
        run: docker compose down -v
    
  frontend-typecheck:
    name: React type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/react-app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit